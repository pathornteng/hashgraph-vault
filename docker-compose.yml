services:
  vault:
    image: hashicorp/vault:1.17  # secp256k1 Transit key type requires Vault 1.10+
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
